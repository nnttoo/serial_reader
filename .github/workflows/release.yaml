name: Build and Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_os:
        description: 'Pilih OS yang mau di-build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ubuntu-22.04
          - windows-latest
          - macos-latest

jobs:
  build:
    # Menggunakan ubuntu-22.04 agar bisa install libwebkit2gtk-4.0
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]

    steps:
      - name: Check if should run
        id: check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" || "${{ github.event.inputs.build_os }}" == "all" || "${{ github.event.inputs.build_os }}" == "${{ matrix.os }}" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: steps.check.outputs.should_run == 'true'
        uses: actions/checkout@v4

      # --- KHUSUS LINUX: Install Dependencies (VERSI 4.0) ---
      - name: Install Linux Dependencies
        if: steps.check.outputs.should_run == 'true' && matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # Di Ubuntu 22.04, paket ini masih ada dan bisa diinstall langsung
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config

      - name: Setup Go
        if: steps.check.outputs.should_run == 'true'
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Setup Node
        if: steps.check.outputs.should_run == 'true'
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Wails
        if: steps.check.outputs.should_run == 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails App
        if: steps.check.outputs.should_run == 'true'
        shell: bash
        run: |
          # Tidak perlu tag tambahan karena library sudah sesuai standar Wails lama
          wails build
          
          cd build/bin
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            EXE_FILE=$(ls *.exe | head -n 1)
            mv "$EXE_FILE" "${{ github.event.repository.name }}-windows-x64.exe"
          elif [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
            BINARY_NAME=$(ls | grep -v "\." | head -n 1)
            mv "$BINARY_NAME" "${{ github.event.repository.name }}-linux-x64"
          else
            zip -r "${{ github.event.repository.name }}-mac-universal.zip" *.app
          fi

      - name: Upload Release Assets
        if: steps.check.outputs.should_run == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            build/bin/${{ github.event.repository.name }}-windows-x64.exe
            build/bin/${{ github.event.repository.name }}-mac-universal.zip
            build/bin/${{ github.event.repository.name }}-linux-x64
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}