name: Build and Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Tambahkan ubuntu-latest di sini
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- KHUSUS LINUX: Install Dependencies ---
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config

      # --- SETUP ENVIRONMENT ---
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # --- PROSES BUILD ---
      - name: Build Wails App
        shell: bash
        run: |
          wails build
          
          cd build/bin
          
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv *.exe "${{ github.event.repository.name }}-windows-x64.exe"
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            # Untuk Linux, biasanya kita rename binary-nya atau dibungkus .tar.gz
            # Kita asumsikan output default adalah nama project tanpa extension
            BINARY_NAME=$(ls | grep -v "\.")
            mv $BINARY_NAME "${{ github.event.repository.name }}-linux-x64"
          else
            zip -r "${{ github.event.repository.name }}-mac-universal.zip" *.app
          fi

      # --- PUBLISH KE GITHUB RELEASE ---
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/bin/${{ github.event.repository.name }}-windows-x64.exe
            build/bin/${{ github.event.repository.name }}-mac-universal.zip
            build/bin/${{ github.event.repository.name }}-linux-x64
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}