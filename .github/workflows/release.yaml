name: Build and Release
on:
  push:
    tags:
      - 'v*' # Berjalan setiap kali push tag baru, misal v1.0.0

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Hanya Windows dan macOS
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- SETUP ENVIRONMENT ---
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # --- PROSES BUILD ---
      - name: Build Wails App
        shell: bash
        run: |
          # Jalankan build sesuai OS masing-masing
          wails build
          
          # Masuk ke folder hasil build
          cd build/bin
          
          # Beri nama file yang unik berdasarkan OS
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            # Rename file .exe agar rapi
            mv *.exe "${{ github.event.repository.name }}-windows-x64.exe"
          else
            # macOS menghasilkan folder .app, kita zip agar tidak rusak strukturnya
            zip -r "${{ github.event.repository.name }}-mac-universal.zip" *.app
          fi

      # --- PUBLISH KE GITHUB RELEASE ---
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          # Hanya upload file Windows dan Mac
          files: |
            build/bin/${{ github.event.repository.name }}-windows-x64.exe
            build/bin/${{ github.event.repository.name }}-mac-universal.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}