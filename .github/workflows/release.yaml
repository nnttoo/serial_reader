name: Build and Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_os:
        description: 'Pilih OS yang mau di-build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ubuntu-latest
          - windows-latest
          - macos-latest

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Logika ini akan memfilter OS berdasarkan input manual kamu
        os: [windows-latest, macos-latest, ubuntu-latest]
    
    # Tambahkan baris 'if' ini agar GitHub skip OS yang tidak dipilih
    if: |
      github.event.inputs.build_os == 'all' || 
      github.event.inputs.build_os == matrix.os ||
      github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- KHUSUS LINUX: Install Dependencies ---
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update 
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      # --- SETUP ENVIRONMENT ---
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # --- PROSES BUILD ---
      - name: Build Wails App
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            wails build -tags webkit2gtk_41
          else
            wails build
          fi
          
          cd build/bin
          
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv *.exe "${{ github.event.repository.name }}-windows-x64.exe"
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            # Untuk Linux, biasanya kita rename binary-nya atau dibungkus .tar.gz
            # Kita asumsikan output default adalah nama project tanpa extension
            BINARY_NAME=$(ls | grep -v "\.")
            mv $BINARY_NAME "${{ github.event.repository.name }}-linux-x64"
          else
            zip -r "${{ github.event.repository.name }}-mac-universal.zip" *.app
          fi

      # --- PUBLISH KE GITHUB RELEASE ---
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/bin/${{ github.event.repository.name }}-windows-x64.exe
            build/bin/${{ github.event.repository.name }}-mac-universal.zip
            build/bin/${{ github.event.repository.name }}-linux-x64
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}